services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sanctum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sanctum
      POSTGRES_PASSWORD: sanctum
      POSTGRES_DB: sanctum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
