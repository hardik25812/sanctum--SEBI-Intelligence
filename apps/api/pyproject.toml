[project]
name = "sanctum-api"
version = "0.1.0"
description = "Sanctum — AI safety harness API for SEBI-regulated wealth advisory"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pgvector>=0.3.6",
    "httpx>=0.28.0",
    "anthropic>=0.39.0",
    "openai>=1.57.0",
    "tiktoken>=0.8.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.2",
    "psycopg2-binary>=2.9.10",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
